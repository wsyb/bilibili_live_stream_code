<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BiliLive Tool</title>
    <!-- [修复] JS 检测系统暗色主题，兼容 Qt WebEngine 无法识别 prefers-color-scheme 的问题 -->
    <script>
      (function() {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        function updateTheme(e) {
          document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
        }
        mq.addEventListener('change', updateTheme);
        updateTheme(mq);
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
      :root {
        --bili-font: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      *, *::before, *::after {
        font-family: var(--bili-font) !important;
      }

      .logs, .logs *, .gemini-input {
        font-family: monospace !important;
      }

      body, html, #app {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
