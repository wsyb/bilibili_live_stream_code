name: Release BiliLiveTool

on:
  push:
    tags:
      - 'v*' # 触发标签：v1.0, v2.0.1 等

jobs:
  update-version:
    name: Update VERSION
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        ref: master

    - name: Write and push VERSION
      run: |
        echo "${{ github.ref_name }}" > VERSION
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add VERSION
        git diff --cached --quiet || git commit -m "chore: update VERSION to ${{ github.ref_name }}"
        git push
      shell: bash

  build:
    name: Build ${{ matrix.arch }}
    needs: update-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
        include:
          - os: ubuntu-22.04
            arch: linux-amd64
            pyinstaller_options: ""
            icon_ext: "png"
          - os: ubuntu-24.04-arm
            arch: linux-arm64
            pyinstaller_options: ""
            icon_ext: "png"
            is_arm: true
          - os: macos-latest
            arch: macos-arm64
            pyinstaller_options: "--windowed"
            icon_ext: "icns"
            is_arm: true
          - os: windows-latest
            arch: windows-amd64
            pyinstaller_options: "--noconsole"
            icon_ext: "ico"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        ref: master

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Build Frontend
      run: |
        cd frontend
        npm install
        npm run build
      shell: bash

    # =============================================
    # Linux 系统依赖
    # =============================================
    - name: Install Linux Dependencies
      if: startsWith(matrix.os, 'ubuntu-')
      run: |
        sudo apt-get update
        sudo apt-get install -y libnss3 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrender1 libxtst6 libxcb-glx0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-render0 libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 libxcb-xfixes0 libxcb-xinerama0 libxcb1 libxkbcommon-x11-0 libxkbcommon0
    - name: Install Backend Dependencies
      run: |
        if [ "${{ matrix.arch }}" = "linux-arm64" ]; then
          # PyQt5/PyQtWebEngine 没有可用的 Linux ARM64 wheel，避免源码编译，改用有 wheel 的 PyQt6。
          grep -vE '^(PyQt5|PyQtWebEngine)' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          pip install PyQt6 PyQt6-WebEngine
        else
          pip install -r requirements.txt
        fi
        pip install pyinstaller Pillow
      shell: bash

    - name: Install Linux Packaging Tools (AppImage + deb)
      if: startsWith(matrix.os, 'ubuntu-')
      run: |
        sudo apt-get install -y desktop-file-utils libfuse2
        # 下载 appimagetool
        wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-$(uname -m).AppImage" -O /tmp/appimagetool
        chmod +x /tmp/appimagetool

    # =============================================
    # Windows 额外工具（Inno Setup）
    # =============================================
    - name: Install Inno Setup (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        choco install innosetup --no-progress -y
        echo "ISCC=C:\Program Files (x86)\Inno Setup 6\ISCC.exe" >> $env:GITHUB_ENV
      shell: pwsh

    # =============================================
    # 准备图标
    # =============================================
    - name: Prepare Platform Icon
      run: |
        if [ "${{ matrix.os }}" == "macos-latest" ] || [ "${{ matrix.os }}" == "macos-13" ]; then
          echo "Converting ICO to ICNS for macOS..."
          sips -s format png bilibili.ico --out temp_icon.png
          mkdir bilibili.iconset
          sips -z 1024 1024 temp_icon.png --out bilibili.iconset/icon_512x512@2x.png
          iconutil -c icns bilibili.iconset
          rm -rf bilibili.iconset temp_icon.png
        elif [ "${{ startsWith(matrix.os, 'ubuntu-') }}" == "true" ]; then
          echo "Converting ICO to PNG for Linux..."
          python -c "from PIL import Image; Image.open('bilibili.ico').save('bilibili.png')"
        fi
      shell: bash

    # =============================================
    # Windows 版本信息
    # =============================================
    - name: Generate Windows Version Info
      if: matrix.os == 'windows-latest'
      run: |
        cat <<EOF > generate_version.py
        import sys

        tag = "${{ github.ref_name }}"
        clean_ver = tag.lstrip('v')

        parts = clean_ver.split('.')
        while len(parts) < 4: parts.append('0')
        ver_tuple = tuple(map(int, parts[:4]))
        ver_str = clean_ver

        content = f"""
        # UTF-8
        VSVersionInfo(
          ffi=FixedFileInfo(
            filevers={ver_tuple},
            prodvers={ver_tuple},
            mask=0x3f,
            flags=0x0,
            OS=0x40004,
            fileType=0x1,
            subtype=0x0,
            date=(0, 0)
          ),
          kids=[
            StringFileInfo(
              [
                StringTable(
                  u'040904B0',
                  [StringStruct(u'CompanyName', u'BiliLiveTool Open Source'),
                   StringStruct(u'FileDescription', u'BiliLiveTool Client'),
                   StringStruct(u'FileVersion', u'{ver_str}'),
                   StringStruct(u'InternalName', u'BiliLiveTool'),
                   StringStruct(u'LegalCopyright', u'Copyright (c) 2026 Open Source'),
                   StringStruct(u'OriginalFilename', u'BiliLiveTool.exe'),
                   StringStruct(u'ProductName', u'BiliLiveTool'),
                   StringStruct(u'ProductVersion', u'{ver_str}')])
              ]
            ),
            VarFileInfo([VarStruct(u'Translation', [1033, 1200])])
          ]
        )
        """

        with open("version_info.txt", "w", encoding="utf-8") as f:
            f.write(content)
            print(f"Generated version_info.txt for version {ver_str}")
        EOF

        python generate_version.py
      shell: bash

    # =============================================
    # PyInstaller 打包
    # =============================================
    - name: Package with PyInstaller
      run: |
        ICON_NAME="bilibili.${{ matrix.icon_ext }}"

        EXTRA_ARGS=""
        if [ "${{ matrix.os }}" == "windows-latest" ]; then
           EXTRA_ARGS="--version-file=version_info.txt"
            pyinstaller main.py \
          --name BiliLiveTool \
          --onefile \
          --add-data "frontend/dist;frontend/dist" \
          --add-data "bilibili.ico;." \
          --add-data "VERSION;." \
          --icon "$ICON_NAME" \
          $EXTRA_ARGS \
          ${{ matrix.pyinstaller_options }}
        elif [ "${{ startsWith(matrix.os, 'ubuntu-') }}" == "true" ]; then
           QT_BINDING_HIDDEN_IMPORT="PyQt5"
           if [ "${{ matrix.arch }}" == "linux-arm64" ]; then
             QT_BINDING_HIDDEN_IMPORT="PyQt6"
           fi

           pyinstaller main.py --name BiliLiveTool --onefile \
            --add-data "frontend/dist:frontend/dist" \
            --add-data "bilibili.ico:." \
            --add-data "VERSION:." \
            --hidden-import _cffi_backend \
            --hidden-import cffi \
            --hidden-import qtpy \
            --hidden-import "$QT_BINDING_HIDDEN_IMPORT" \
            --hidden-import webview.platforms.qt
        elif [ "${{ startsWith(matrix.os, 'macos-') }}" == "true" ]; then
            pyinstaller main.py \
              --name BiliLiveTool \
              --onefile \
              --add-data "frontend/dist:frontend/dist" \
              --add-data "bilibili.ico:." \
              --add-data "VERSION:." \
              --icon "$ICON_NAME" \
              --hidden-import _cffi_backend \
              $EXTRA_ARGS \
              ${{ matrix.pyinstaller_options }}
        fi

      shell: bash

    # =============================================
    # 构建安装包
    # =============================================

    # --- Windows: Inno Setup 安装包 ---
    - name: Build Windows Installer (Inno Setup)
      if: matrix.os == 'windows-latest'
      run: |
        $version = "${{ github.ref_name }}".TrimStart('v')
        $issContent = Get-Content "packaging/windows/installer.iss" -Raw
        $issContent = $issContent.Replace('{#AppVersion}', $version)
        Set-Content "packaging/windows/installer.iss" $issContent
        $rootPath = (Get-Location).Path
        $issContent = $issContent.Replace('{#RepoRoot}', $rootPath)
        Set-Content "packaging/windows/installer.iss" $issContent
        $issPath = Join-Path $rootPath "packaging/windows/installer.iss"
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" $issPath
        New-Item -ItemType Directory -Force -Path installers
        Move-Item -Path "BiliLiveTool-*-Setup.exe" -Destination installers/
      shell: pwsh

    # --- macOS: .dmg (使用内置 hdiutil，无需第三方工具) ---
    - name: Build macOS DMG
      if: startsWith(matrix.os, 'macos-')
      run: |
        VERSION="${{ github.ref_name }}"
        DMG_NAME="BiliLiveTool-${VERSION}-${{ matrix.arch }}.dmg"
        VOLUME_NAME="B站直播工具 ${VERSION#v}"

        # 在 dist/ 里找到 .app
        APP_PATH=$(find dist -name "*.app" -type d | head -1)
        if [ -z "$APP_PATH" ]; then
          echo "No .app found in dist/"
          ls -la dist/
          exit 1
        fi
        echo "Found .app at: $APP_PATH"

        # 使用 hdiutil 创建 DMG（macOS 内置，无需额外安装）
        mkdir -p /tmp/dmg
        cp -R "$APP_PATH" /tmp/dmg/
        hdiutil create -volname "$VOLUME_NAME" \
          -srcfolder /tmp/dmg \
          -ov -format UDZO \
          "$DMG_NAME"

        mkdir -p installers
        mv "$DMG_NAME" installers/
      shell: bash

    # --- Linux: AppImage + .deb ---
    - name: Build Linux AppImage and .deb
      if: startsWith(matrix.os, 'ubuntu-')
      run: |
        VERSION="${{ github.ref_name }}"
        CLEAN_VER="${VERSION#v}"
        ARCH="${{ matrix.arch }}"  # linux-amd64 or linux-arm64

        # 确定架构名用于 deb
        if [ "${{ matrix.arch }}" == "linux-arm64" ]; then
          DEB_ARCH="arm64"
        else
          DEB_ARCH="amd64"
        fi

        BINARY="dist/BiliLiveTool"
        if [ ! -f "$BINARY" ]; then
          echo "Binary not found at $BINARY"
          ls -la dist/
          exit 1
        fi

        mkdir -p installers

        # ========== .deb 打包 ==========
        DEB_DIR="deb-pkg/BiliLiveTool_${CLEAN_VER}_${DEB_ARCH}"
        mkdir -p "${DEB_DIR}/DEBIAN"
        mkdir -p "${DEB_DIR}/usr/bin"
        mkdir -p "${DEB_DIR}/usr/share/applications"
        mkdir -p "${DEB_DIR}/usr/share/icons/hicolor/256x256/apps"
        mkdir -p "${DEB_DIR}/usr/share/metainfo"

        # 用 printf 代替 heredoc，避免 YAML 解析问题
        printf 'Package: bilibili-live-tool\nVersion: %s\nArchitecture: %s\nMaintainer: BiliLiveTool Open Source\nDescription: Bilibili 直播弹幕管理与推流工具\n 自动获取推流码、弹幕监控、发送弹幕，配合 OBS 推流。\nDepends: libnss3, libxcb-xinerama0, libxcb-cursor0\nSection: net\nPriority: optional\nHomepage: https://github.com/wsyb/bilibili_live_stream_code\n' \
          "${CLEAN_VER}" "${DEB_ARCH}" \
          > "${DEB_DIR}/DEBIAN/control"

        install -m 755 "$BINARY" "${DEB_DIR}/usr/bin/bilibili-live"
        install -m 644 "bilibili.png" "${DEB_DIR}/usr/share/icons/hicolor/256x256/apps/bilibili-live.png"
        install -m 644 "packaging/linux/BiliLiveTool.desktop" "${DEB_DIR}/usr/share/applications/bilibili-live.desktop"
        install -m 644 "packaging/linux/bilibili-live.appdata.xml" "${DEB_DIR}/usr/share/metainfo/bilibili-live.appdata.xml"

        dpkg-deb --build "${DEB_DIR}"
        mv "deb-pkg/BiliLiveTool_${CLEAN_VER}_${DEB_ARCH}.deb" "installers/"

        # ========== AppImage 打包 ==========
        APPDIR="AppDir"
        mkdir -p "${APPDIR}/usr/bin"
        mkdir -p "${APPDIR}/usr/share/icons/hicolor/256x256/apps"
        mkdir -p "${APPDIR}/usr/share/applications"

        install -m 755 "$BINARY" "${APPDIR}/usr/bin/bilibili-live"
        install -m 644 "bilibili.png" "${APPDIR}/bilibili-live.png"
        install -m 644 "bilibili.png" "${APPDIR}/usr/share/icons/hicolor/256x256/apps/bilibili-live.png"
        install -m 644 "packaging/linux/BiliLiveTool.desktop" "${APPDIR}/bilibili-live.desktop"

        # 用 printf 写 desktop 文件，避免 heredoc + YAML 解析问题
        printf '%s\n' \
          '[Desktop Entry]' \
          'Name=B站直播工具' \
          'Comment=Bilibili 直播弹幕管理与推流工具' \
          'Exec=bilibili-live' \
          'Icon=bilibili-live' \
          'Terminal=false' \
          'Type=Application' \
          'Categories=Utility;Network;' \
          'StartupNotify=true' \
          > "${APPDIR}/bilibili-live.desktop"

        # 创建 AppRun
        printf '%s\n' \
          '#!/bin/bash' \
          'APPDIR="$(dirname "$(readlink -f "$0")")"' \
          'export PATH="${APPDIR}/usr/bin:${PATH}"' \
          'export QTWEBENGINE_CHROMIUM_FLAGS="--no-sandbox --enable-features=UseOzonePlatform"' \
          'exec "${APPDIR}/usr/bin/bilibili-live" "$@"' \
          > "${APPDIR}/AppRun"
        chmod +x "${APPDIR}/AppRun"

        # 使用 appimagetool
        /tmp/appimagetool "${APPDIR}" "installers/BiliLiveTool-${VERSION}-${ARCH}.AppImage"

        echo "Packaging complete for ${ARCH}:"
        ls -lh installers/
      shell: bash

    # =============================================
    # 上传 Artifact（供 create-release 使用）
    # =============================================
    - name: Upload Installer Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BiliLiveTool-${{ github.ref_name }}-${{ matrix.arch }}
        path: installers/*

  create-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: List downloaded artifacts
      run: find artifacts -type f | sort
      shell: bash

    - name: Get Raw Git Changelog
      id: raw_changelog
      run: |
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

        if [ -z "$PREVIOUS_TAG" ]; then
          LOGS=$(git log --no-merges --pretty=format:"- %s" | grep -v "chore: update VERSION")
        else
          LOGS=$(git log --no-merges --pretty=format:"- %s" $PREVIOUS_TAG..HEAD | grep -v "chore: update VERSION")
        fi

        echo "RAW_CHANGELOG<<EOF" >> $GITHUB_ENV
        echo "$LOGS" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV
      shell: bash

    - name: Summarize Changelog with DeepSeek
      id: ai_summary
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      run: |
        python3 -c "
        import os, json, urllib.request

        api_key = os.environ.get('DEEPSEEK_API_KEY')
        raw_log = os.environ.get('RAW_CHANGELOG', '').strip()
        env_file = os.environ.get('GITHUB_ENV')

        def write_env(content):
            with open(env_file, 'a', encoding='utf-8') as f:
                f.write('AI_CHANGELOG<<EOF\n')
                f.write(content + '\n')
                f.write('EOF\n')

        if not api_key or not raw_log:
            print('Missing API Key or empty changelog. Using raw logs.')
            write_env(raw_log if raw_log else 'No changes detected.')
            exit(0)

        prompt = f'''请作为一名专业的产品经理，将以下原始的 git commit 日志总结为一份面向普通用户的版本更新说明 (Release Notes)。
        要求：
        1. 忽略纯代码格式化、错别字修改或无意义的琐碎提交。
        2. 将更新内容分类，例如使用：'✨ 新特性', '🐛 问题修复', '🔧 体验优化' 等标题。
        3. 语气要友好、专业，排版使用 Markdown 格式。
        4. 直接输出总结内容，不要包含多余的寒暄语。

        原始日志如下：\n{raw_log}'''

        url = 'https://api.deepseek.com/chat/completions'
        headers = {
            'Content-Type': 'application/json',
            'Authorization': f'Bearer {api_key}'
        }
        data = {
            'model': 'deepseek-v4-flash',
            'messages': [{'role': 'user', 'content': prompt}],
            'temperature': 0.3
        }

        req = urllib.request.Request(url, data=json.dumps(data).encode('utf-8'), headers=headers, method='POST')
        try:
            with urllib.request.urlopen(req) as response:
                result = json.loads(response.read().decode('utf-8'))
                ai_reply = result['choices'][0]['message']['content']
                print('Successfully generated AI summary.')
                write_env(ai_reply)
        except Exception as e:
            print(f'Failed to call DeepSeek API: {e}')
            print('Falling back to raw logs.')
            write_env(raw_log)
        "
      shell: bash

    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/*/*
        body: |
          ## 🚀 BiliLiveTool ${{ github.ref_name }} 发布

          ${{ env.AI_CHANGELOG }}

          ---

          ### 📦 下载地址
          请根据您的系统选择对应的版本进行下载：

          | 平台 | 架构 | 格式 |
          |------|------|------|
          | Windows | amd64 | `BiliLiveTool-*-windows-amd64-Setup.exe` (安装包) |
          | macOS | Apple Silicon | `BiliLiveTool-*-macos-arm64.dmg` |
          | Linux | amd64 | `BiliLiveTool-*-linux-amd64.AppImage` (通用) |
          | Linux | amd64 | `BiliLiveTool-*-linux-amd64.deb` (Ubuntu/Debian) |
          | Linux | ARM64 | `BiliLiveTool-*-linux-arm64.AppImage` (通用) |
          | Linux | ARM64 | `BiliLiveTool-*-linux-arm64.deb` (Ubuntu/Debian) |

          ### 🛡️ Windows 用户安全提示
          如果您在 Windows 上运行遇到 **"Windows 已保护你的电脑"** (SmartScreen) 蓝框提示：
          1. 点击 **"更多信息" (More Info)**
          2. 点击 **"仍要运行" (Run Anyway)**

          > 💡 这是因为开源软件通常未购买数字签名证书，属于正常拦截现象，请放心使用。

        draft: false
        prerelease: false
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
